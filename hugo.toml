baseURL = "https://troypeiler.com/"
languageCode = "en-us"
title = "Troy Peiler"
theme = "PaperMod"

[params]
  env = "production"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowShareButtons = false
  disableSpecial1stPost = true
  profileModeAvatar = "circle"

[params.profileMode]
  enabled = true
  title = "Troy Peiler"
  subtitle = "Compliance Analyst pivoting to Cloud Security Engineering. Building and documenting real-world AWS security projects."
  imageUrl = "/img/profile.jpg"
  imageTitle = "Troy Peiler"
  imageWidth = 160
  imageHeight = 160
  
[[params.profileMode.buttons]]
  name = "Projects"
  url = "/projects/"

[[params.profileMode.buttons]]
  name = "Resume"
  url = "/resume/"

[[params.profileMode.buttons]]
  name = "Contact"
  url = "/contact/"

